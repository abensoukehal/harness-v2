client: <client>
# repos: one url per repo the stacks name; init --config and link clone what is missing
# repos:
#   frontend: git@github.com:<client>/frontend.git
#   backend: git@github.com:<client>/backend.git
stacks:
  frontend:
    repo: frontend
    path: repos/frontend
    framework: nextjs@14
    package_manager: pnpm
    commands:
      install: pnpm install
      dev: pnpm dev --port ${PORT_FRONTEND}
      build: pnpm build
      lint: pnpm lint
      typecheck: pnpm tsc --noEmit
      test: pnpm test
    env_file: frontend.env
    dev_url: http://localhost:${PORT_FRONTEND}
    depends_on: [backend]
    health:
      log: "ready on"
    health_timeout_s: 120
  backend:
    repo: backend
    path: repos/backend
    framework: django@5
    commands:
      install: pip install -r requirements.txt
      dev: python manage.py runserver 0.0.0.0:${PORT_BACKEND}
      test: pytest
      lint: ruff check .
    env_file: backend.env
    dev_url: http://localhost:${PORT_BACKEND}
    logs: stdout
    depends_on: [db]
    health:
      http: http://localhost:${PORT_BACKEND}/healthz
      expect_status: 200
    health_timeout_s: 180
    seed: python manage.py loaddata fixtures/seed.json
  db:
    repo: null
    path: null
    commands:
      dev: docker compose up -d postgres
    health:
      tcp: ${PORT_DB}
    health_timeout_s: 60

delivery:
  base_branch: develop
  target_branch: develop
  branch_prefix: feature/
  mode: pr
  commit_author:
    name: Your Name
    email: you@example.com

git:
  identity_hygiene: strict

notify:
  telegram:
    chat_id_ref: telegram_chat_id
  events: [plan_ready, run_finished, needs_answer]

client_tests:
  backend: pytest
  frontend: pnpm test

test_runner:
  frontend: pnpm vitest run
  backend: pytest --rootdir=product/tests/backend

browser_runner:
  frontend: pnpm playwright test

budget:
  tokens_per_feature: 2000000

qa:
  max_fixes: 10

visual:
  threshold_pct: 2.0
  viewport: 1440x900
  max_attempts: 4

design:
  comparable: true            # false for wireframes and block mockups: no visual criterion, recorded as a gap

max_parallel_features: 2

agents:                       # model and effort per role (6.3); static per workspace, inherit = the session's own setting
  planner:     { model: inherit, effort: inherit }
  test-writer: { model: inherit, effort: inherit }
  worker:      { model: inherit, effort: inherit }
  reviewer:    { model: inherit, effort: inherit }
  qa:          { model: inherit, effort: inherit }
  retro:       { model: inherit, effort: inherit }
  io:          { model: inherit, effort: low }
