client: <client>
# repos: one url per repo the stacks name; init --config and link clone what is missing
# repos:
#   frontend: git@github.com:<client>/frontend.git
#   backend: git@github.com:<client>/backend.git
stacks:
  frontend:
    repo: frontend
    path: repos/frontend
    framework: nextjs@14
    package_manager: pnpm
    commands:
      install: pnpm install
      dev: pnpm dev --port ${PORT_FRONTEND}
      build: pnpm build
      lint: pnpm lint
      typecheck: pnpm tsc --noEmit
      test: pnpm test
    # env_files: [.env, .env.local] # each resolved from secrets/frontend/, later entries winning
    # secrets: [SESSION_SECRET]     # the keys the scrubber covers; every other key in those files is config
    dev_url: http://localhost:${PORT_FRONTEND}
    depends_on: [backend]
    health:                        # a list: every entry must pass before the stack counts as up
      - log: "ready on"
    health_timeout_s: 120
  backend:
    repo: backend
    path: repos/backend
    framework: django@5
    commands:
      install: pip install -r requirements.txt
      dev: python manage.py runserver 0.0.0.0:${PORT_BACKEND}
      test: pytest
      lint: ruff check .
    # env_files: [.env]
    # secrets: [DATABASE_URL, DJANGO_SECRET_KEY]
    dev_url: http://localhost:${PORT_BACKEND}
    logs: stdout
    depends_on: [db]
    health:
      - log: "Starting development server"
      - http: http://localhost:${PORT_BACKEND}/healthz   # a full URL, not a bare port
        expect_status: 200
    health_timeout_s: 180
    seed: python manage.py loaddata fixtures/seed.json
  db:
    repo: null
    path: null
    commands:
      dev: docker compose up -d postgres
    health:
      - tcp: ${PORT_DB}
    health_timeout_s: 60

delivery:
  base_branch: develop        # one branch, or one per repo: {frontend: master, backend: develop}
  target_branch: develop      # same two shapes; a map names every repo the stacks live in
  branch_prefix: feature/
  mode: branch                # branch | direct_merge; branch pushes and stops
  commit_author:
    name: Your Name
    email: you@example.com

notify:
  # An event is refused at validation until secrets/<chat_id_ref> and secrets/telegram_bot_token both exist,
  # so put them there first and then name the events. Until then this stays empty.
  telegram:
    chat_id_ref: telegram_chat_id
  events: []

client_tests:
  backend: pytest
  frontend: pnpm test

test_runner:
  frontend: pnpm vitest run
  backend: pytest --rootdir=product/tests/backend

browser_runner:
  frontend: pnpm playwright test

budget:
  # Deliberately loose for the first run on a real repo: double what the archive-items run (run 4) spent,
  # 5.97M across plan and build with 2.46M of it attributed to its two sub-tasks. Ingestion scales with the
  # repo, not the feature, so a legacy codebase can outspend a measured toy before its first sub-task. The
  # run-1 retro sets the real pair from that run's own measurement.
  tokens_per_feature: 7200000
  tokens_per_subtask: 2500000

qa:
  max_fixes: 10

visual:
  threshold_pct: 2.0
  viewport: 1440x900
  max_attempts: 4

design:
  comparable: true            # false for wireframes and block mockups: no visual criterion, recorded as a gap

agents:                       # model and effort per role (6.3); static per workspace, inherit = the session's own setting
  planner:     { model: inherit, effort: inherit }
  test-writer: { model: inherit, effort: inherit }
  worker:      { model: inherit, effort: inherit }
  reviewer:    { model: inherit, effort: inherit }
  qa:          { model: inherit, effort: inherit }
  retro:       { model: inherit, effort: inherit }
  io:          { model: inherit, effort: low }
